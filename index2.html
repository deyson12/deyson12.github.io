<script>

/* =========================================================
   VARIABLES
========================================================= */

let map = null;

let geocoder = null;

let infoWindow = null;

let records = [];

let markers = [];


/*
 * Guardamos las coordenadas ya utilizadas.
 *
 * Esto permite saber si una nueva dirección
 * cae exactamente en una ubicación que ya
 * tiene marcador.
 */

const markerByLocation = new Map();


/*
 * Contador de personas ubicadas.
 */

let locatedCount = 0;


/*
 * Total de direcciones procesadas.
 */

let processedAddresses = 0;


/* =========================================================
   MENU
========================================================= */

function toggleSidebar() {

    const sidebar =
        document.getElementById(
            "sidebar"
        );

    const overlay =
        document.getElementById(
            "overlay"
        );


    sidebar.classList.toggle(
        "hidden"
    );

    overlay.classList.toggle(
        "hidden"
    );

}


function closeSidebar() {

    document
        .getElementById(
            "sidebar"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "overlay"
        )
        .classList.add(
            "hidden"
        );

}


/* =========================================================
   GOOGLE MAPS
========================================================= */

function initMap() {

    /*
     * IMPORTANTE:
     *
     * Este centro y zoom son FIJOS.
     *
     * Durante la carga de datos NO se modifica
     * ni center ni zoom.
     */

    map =
        new google.maps.Map(
            document.getElementById(
                "map"
            ),
            {

                center: {
                    lat: 6.2442,
                    lng: -75.5812
                },

                /*
                 * Zoom alejado.
                 */

                zoom: 11,

                mapTypeControl: true,

                streetViewControl: true,

                fullscreenControl: true

            }
        );


    geocoder =
        new google.maps.Geocoder();


    infoWindow =
        new google.maps.InfoWindow();


    setStatus(
        "⏳ Cargando datos.json..."
    );


    loadData();

}


/* =========================================================
   CARGAR DATOS
========================================================= */

async function loadData() {

    try {

        const response =
            await fetch(
                "datos.json"
            );


        if (!response.ok) {

            throw new Error(
                "No se pudo cargar datos.json"
            );

        }


        const text =
            await response.text();


        /*
         * Acepta:
         *
         * {...}
         * {...}
         * {...}
         */

        const data =
            parseConcatenatedJSON(
                text
            );


        if (!data.length) {

            throw new Error(
                "No se encontraron registros válidos"
            );

        }


        records =
            data.map(
                (item, index) => ({

                    ...item,

                    _index:
                        index,

                    _status:
                        "pending",

                    _lat:
                        null,

                    _lng:
                        null,

                    _formattedAddress:
                        null

                })
            );


        document.getElementById(
            "totalCount"
        ).textContent =
            records.length.toLocaleString();


        populateCompanies();

        renderList();


        /*
         * Comenzar inmediatamente
         * con las direcciones.
         */

        processAddresses();

    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "❌ " +
            error.message
        );

    }

}


/* =========================================================
   PARSER JSON CONCATENADO
========================================================= */

function parseConcatenatedJSON(
    text
) {

    const result = [];

    let depth = 0;

    let start = -1;

    let inString = false;

    let escaped = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];


        if (inString) {

            if (escaped) {

                escaped = false;

                continue;

            }


            if (
                char === "\\"
            ) {

                escaped = true;

                continue;

            }


            if (
                char === '"'
            ) {

                inString = false;

            }


            continue;

        }


        if (
            char === '"'
        ) {

            inString = true;

            continue;

        }


        if (
            char === "{"
        ) {

            if (
                depth === 0
            ) {

                start = i;

            }

            depth++;

        }


        else if (
            char === "}"
        ) {

            depth--;


            if (
                depth === 0 &&
                start !== -1
            ) {

                const block =
                    text.substring(
                        start,
                        i + 1
                    );


                try {

                    result.push(
                        JSON.parse(
                            block
                        )
                    );

                }

                catch (error) {

                    console.error(
                        "Objeto inválido:",
                        block
                    );

                }


                start = -1;

            }

        }

    }


    return result;

}


/* =========================================================
   NORMALIZAR DIRECCIÓN
========================================================= */

function normalizeAddress(
    address
) {

    if (!address) {

        return "";

    }


    let value =
        String(address)
            .toUpperCase()
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    value =
        value

            .replace(
                /\bCRA\b/g,
                "CARRERA"
            )

            .replace(
                /\bCR\b/g,
                "CARRERA"
            )

            .replace(
                /\bKR\b/g,
                "CARRERA"
            )

            .replace(
                /\bKRA\b/g,
                "CARRERA"
            )

            .replace(
                /\bCLL\b/g,
                "CALLE"
            )

            .replace(
                /\bCL\b/g,
                "CALLE"
            );


    /*
     * Si no especifican ciudad,
     * asumimos Medellín.
     */

    if (
        !value.includes(
            "MEDELLIN"
        ) &&
        !value.includes(
            "MEDELLÍN"
        )
    ) {

        value +=
            ", Medellín, Antioquia, Colombia";

    }


    return value;

}


/* =========================================================
   DIRECCIÓN BASE
========================================================= */

function getAddressKey(
    address
) {

    let value =
        normalizeAddress(
            address
        );


    /*
     * Quitamos apartamento,
     * torre, interior, etc.
     *
     * Así las personas del mismo edificio
     * comparten coordenada.
     */

    value =
        value

            .replace(
                /\bAPTO\b.*$/i,
                ""
            )

            .replace(
                /\bAPT\b.*$/i,
                ""
            )

            .replace(
                /\bAPARTAMENTO\b.*$/i,
                ""
            )

            .replace(
                /\bTORRE\b.*$/i,
                ""
            )

            .replace(
                /\bINT\b.*$/i,
                ""
            )

            .replace(
                /\bINTERIOR\b.*$/i,
                ""
            )

            .replace(
                /\bURBANIZACION\b.*$/i,
                ""
            )

            .replace(
                /\bURBANIZACIÓN\b.*$/i,
                ""
            )

            .replace(
                /\s+/g,
                " "
            )

            .trim();


    return value;

}


/* =========================================================
   PROCESAR DIRECCIONES
========================================================= */

async function processAddresses() {

    const uniqueAddresses =
        new Map();


    /*
     * Obtener únicamente direcciones
     * diferentes.
     */

    records.forEach(
        record => {

            const key =
                getAddressKey(
                    record.nomenclatura
                );


            if (
                key &&
                !uniqueAddresses.has(
                    key
                )
            ) {

                uniqueAddresses.set(
                    key,
                    record.nomenclatura
                );

            }

        }
    );


    const addresses =
        [
            ...uniqueAddresses.entries()
        ];


    document.getElementById(
        "addressCount"
    ).textContent =
        addresses.length.toLocaleString();


    const total =
        addresses.length;


    /*
     * ======================================================
     * PROCESAMOS UNA DIRECCIÓN A LA VEZ.
     *
     * Cada vez que termina una:
     *
     * 1. Se actualizan sus registros.
     * 2. Se crea el punto.
     * 3. El punto aparece inmediatamente.
     * 4. El mapa NO se mueve.
     * ======================================================
     */

    for (
        let i = 0;
        i < total;
        i++
    ) {

        const [
            key,
            originalAddress
        ] =
            addresses[i];


        try {

            const result =
                await geocodeAddress(
                    normalizeAddress(
                        originalAddress
                    )
                );


            if (
                result &&
                result.geometry &&
                result.geometry.location
            ) {

                const location =
                    result.geometry.location;


                /*
                 * Registros correspondientes
                 * a esta dirección.
                 */

                const matchingRecords =
                    records.filter(
                        record =>
                            getAddressKey(
                                record.nomenclatura
                            ) === key
                    );


                matchingRecords.forEach(
                    record => {

                        record._lat =
                            location.lat();

                        record._lng =
                            location.lng();

                        record._formattedAddress =
                            result.formatted_address;

                        record._status =
                            "located";

                    }
                );


                /*
                 * Actualizamos contador.
                 */

                locatedCount =
                    records.filter(
                        record =>
                            record._status ===
                            "located"
                    ).length;


                /*
                 * =================================================
                 * CREAR EL PUNTO INMEDIATAMENTE
                 * =================================================
                 */

                addLocationMarker(
                    location,
                    matchingRecords
                );


                /*
                 * Actualizar UI.
                 */

                document.getElementById(
                    "locatedCount"
                ).textContent =
                    locatedCount.toLocaleString();


                renderList();

            }

        }

        catch (error) {

            console.warn(
                "Error geocodificando:",
                originalAddress,
                error
            );

        }


        processedAddresses =
            i + 1;


        updateProgress(
            processedAddresses,
            total
        );


        /*
         * Pausa pequeña para no saturar
         * la API.
         */

        await sleep(
            100
        );

    }


    /*
     * ======================================================
     * FINAL
     * ======================================================
     */

    setStatus(
        `✓ Terminado · ${locatedCount.toLocaleString()} registros ubicados`
    );

}


/* =========================================================
   GEOCODIFICAR
========================================================= */

function geocodeAddress(
    address
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            geocoder.geocode(
                {

                    address:
                        address,

                    region:
                        "CO"

                },

                (
                    results,
                    status
                ) => {

                    if (
                        status ===
                            "OK" &&
                        results &&
                        results.length
                    ) {

                        resolve(
                            results[0]
                        );

                    }

                    else {

                        reject(
                            status
                        );

                    }

                }
            );

        }
    );

}


/* =========================================================
   AGREGAR UBICACIÓN
========================================================= */

function addLocationMarker(
    location,
    locationRecords
) {

    const lat =
        location.lat();

    const lng =
        location.lng();


    /*
     * Clave de coordenadas.
     */

    const key =
        `${lat.toFixed(6)},${lng.toFixed(6)}`;


    /*
     * ======================================================
     * SI YA HAY UN MARCADOR AQUÍ
     * ======================================================
     */

    if (
        markerByLocation.has(
            key
        )
    ) {

        const marker =
            markerByLocation.get(
                key
            );


        marker._records.push(
            ...locationRecords
        );


        /*
         * Eliminar duplicados.

         */

        marker._records =
            [
                ...new Map(
                    marker._records.map(
                        record => [
                            record._index,
                            record
                        ]
                    )
                ).values()
            ];


        updateMarkerTitle(
            marker
        );


        return;

    }


    /*
     * ======================================================
     * NUEVO MARCADOR
     * ======================================================
     */

    const marker =
        new google.maps.Marker({

            position: {

                lat:
                    lat,

                lng:
                    lng

            },

            map:
                map,

            title:
                locationRecords.length === 1
                    ? (
                        locationRecords[0]
                            .nombre ||
                        "Registro"
                    )
                    : `${locationRecords.length} registros`

        });


    marker._records =
        [
            ...locationRecords
        ];


    /*
     * Guardamos el marcador.
     */

    markerByLocation.set(
        key,
        marker
    );


    markers.push(
        marker
    );


    /*
     * ======================================================
     * CLICK
     * ======================================================
     */

    marker.addListener(
        "click",
        () => {

            openMarkerInfo(
                marker
            );

        }
    );

}


/* =========================================================
   ACTUALIZAR TÍTULO MARCADOR
========================================================= */

function updateMarkerTitle(
    marker
) {

    const count =
        marker._records.length;


    marker.setTitle(

        count === 1
            ? (
                marker
                    ._records[0]
                    .nombre ||
                "Registro"
            )
            : `${count} registros`

    );

}


/* =========================================================
   INFO DEL MARCADOR
========================================================= */

function openMarkerInfo(
    marker
) {

    const list =
        marker._records || [];


    let html;


    /*
     * UNA PERSONA
     */

    if (
        list.length === 1
    ) {

        html =
            createInfoWindow(
                list[0]
            );

    }


    /*
     * VARIAS PERSONAS
     */

    else {

        const first =
            list[0];


        html = `

            <div class="info">

                <h3>
                    📍 ${list.length} registros
                </h3>


                <div class="info-row">

                    <span class="info-label">
                        Dirección:
                    </span>

                    <br>

                    ${
                        escapeHtml(
                            first.nomenclatura
                        )
                    }

                </div>


                <hr>


                ${
                    list
                        .map(
                            record => `

                            <div
                                class="group-item"
                                data-record-index="${record._index}"
                            >

                                <div class="group-name">

                                    ${
                                        escapeHtml(
                                            record.nombre ||
                                            "Sin nombre"
                                        )
                                    }

                                </div>


                                <div class="group-meta">

                                    ${
                                        record.edad != null
                                            ? `Edad: ${record.edad}`
                                            : ""
                                    }

                                    ${
                                        record.nombre_empresa
                                            ? ` · ${escapeHtml(record.nombre_empresa)}`
                                            : ""
                                    }

                                </div>

                            </div>

                        `
                        )
                        .join("")
                }

            </div>

        `;

    }


    infoWindow.setContent(
        html
    );


    infoWindow.open({

        map:
            map,

        anchor:
            marker

    });


    /*
     * Eventos de personas agrupadas.
     */

    setTimeout(
        () => {

            document
                .querySelectorAll(
                    ".group-item"
                )
                .forEach(
                    element => {

                        element.onclick =
                            () => {

                                const index =
                                    Number(
                                        element
                                            .dataset
                                            .recordIndex
                                    );


                                focusRecord(
                                    index
                                );

                            };

                    }
                );

        },
        0
    );

}

/* =========================================================
   LISTA
========================================================= */

function renderList() {

    const container =
        document.getElementById(
            "recordList"
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const minAge =
        parseInt(
            document.getElementById(
                "minAge"
            ).value
        ) || null;


    const maxAge =
        parseInt(
            document.getElementById(
                "maxAge"
            ).value
        ) || null;


    const company =
        document.getElementById(
            "companyFilter"
        ).value;


    const filtered =
        records.filter(
            record => {

                const text =
                    [
                        record.nombre,
                        record.email,
                        record.celular,
                        record.nomenclatura,
                        record.nombre_empresa,
                        record.cddni
                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                if (
                    search &&
                    !text.includes(
                        search
                    )
                ) {

                    return false;

                }


                if (
                    minAge !== null &&
                    Number(
                        record.edad
                    ) < minAge
                ) {

                    return false;

                }


                if (
                    maxAge !== null &&
                    Number(
                        record.edad
                    ) > maxAge
                ) {

                    return false;

                }


                if (
                    company &&
                    record.nombre_empresa !==
                    company
                ) {

                    return false;

                }


                return true;

            }
        );


    container.innerHTML =
        "";


    filtered.forEach(
        record => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "record";


            element.onclick =
                () =>
                    focusRecord(
                        record._index
                    );


            element.innerHTML = `

                <div class="record-name">

                    ${
                        escapeHtml(
                            record.nombre ||
                            "Sin nombre"
                        )
                    }

                </div>


                <div class="record-address">

                    📍 ${
                        escapeHtml(
                            record.nomenclatura ||
                            "Sin dirección"
                        )
                    }

                </div>


                ${
                    record.nombre_empresa
                        ? `

                            <div class="record-company">

                                🏢 ${
                                    escapeHtml(
                                        record.nombre_empresa
                                    )
                                }

                            </div>

                        `
                        : ""
                }


                ${
                    record.edad != null
                        ? `

                            <span class="badge">

                                ${
                                    escapeHtml(
                                        String(
                                            record.edad
                                        )
                                    )
                                }
                                años

                            </span>

                        `
                        : ""
                }


                ${
                    record._status ===
                    "located"
                        ? `

                            <span
                                class="badge"
                                style="
                                    background:#ecfdf5;
                                    color:#047857;
                                "
                            >
                                ✓ Ubicado
                            </span>

                        `
                        : `

                            <span
                                class="badge"
                                style="
                                    background:#fef3c7;
                                    color:#92400e;
                                "
                            >
                                ⏳ Pendiente
                            </span>

                        `
                }

            `;


            container.appendChild(
                element
            );

        }
    );


    if (
        !filtered.length
    ) {

        container.innerHTML = `

            <div
                style="
                    padding:20px;
                    text-align:center;
                    color:#9ca3af;
                    font-size:12px;
                "
            >
                No hay registros que coincidan.
            </div>

        `;

    }

}


/* =========================================================
   EMPRESAS
========================================================= */

function populateCompanies() {

    const select =
        document.getElementById(
            "companyFilter"
        );


    const companies =
        [
            ...new Set(
                records
                    .map(
                        record =>
                            record.nombre_empresa
                    )
                    .filter(Boolean)
            )
        ]
        .sort(
            (a, b) =>
                String(a)
                    .localeCompare(
                        String(b)
                    )
        );


    companies.forEach(
        company => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                company;


            option.textContent =
                company;


            select.appendChild(
                option
            );

        }
    );

}


/* =========================================================
   ENFOCAR REGISTRO
========================================================= */

function focusRecord(
    index
) {

    const record =
        records[index];


    if (!record) {

        return;

    }


    if (
        record._status !==
        "located"
    ) {

        alert(
            "Este registro todavía no tiene ubicación."
        );

        return;

    }


    /*
     * IMPORTANTE:
     *
     * Aquí sí hacemos zoom porque el usuario
     * hizo clic explícitamente en un registro.
     *
     * Durante la carga automática jamás hacemos
     * esto.
     */

    map.panTo({

        lat:
            record._lat,

        lng:
            record._lng

    });


    map.setZoom(
        18
    );


    const key =
        `${record._lat.toFixed(6)},${record._lng.toFixed(6)}`;


    const marker =
        markerByLocation.get(
            key
        );


    if (marker) {

        openMarkerInfo(
            marker
        );

    }

}


/* =========================================================
   FIT MAP
========================================================= */

function fitMap() {

    /*
     * Esta función queda disponible
     * únicamente cuando el usuario pulsa
     * "Ver todo".
     *
     * No se ejecuta automáticamente.
     */

    if (!markers.length) {

        return;

    }


    const bounds =
        new google.maps.LatLngBounds();


    markers.forEach(
        marker => {

            bounds.extend(
                marker.getPosition()
            );

        }
    );


    map.fitBounds(
        bounds
    );

}


/* =========================================================
   PROGRESO
========================================================= */

function updateProgress(
    current,
    total
) {

    const percentage =
        total > 0
            ? (
                current /
                total
            ) * 100
            : 0;


    document.getElementById(
        "progressBar"
    ).style.width =
        `${percentage}%`;


    setStatus(
        `⏳ ${current.toLocaleString()} de ${total.toLocaleString()} direcciones procesadas · ${locatedCount.toLocaleString()} ubicados`
    );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text
) {

    document.getElementById(
        "statusText"
    ).textContent =
        text;

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   DELAY
========================================================= */

function sleep(
    ms
) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}
